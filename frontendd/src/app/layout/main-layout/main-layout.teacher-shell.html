<div class="layout">
  <button
    *ngIf="isMobileView"
    type="button"
    class="mobile-toggle-btn"
    (click)="toggleSidebar()"
    aria-label="Open navigation">
    <span class="material-symbols-rounded">menu</span>
  </button>

  <div
    class="sidebar-backdrop"
    *ngIf="isMobileView && sidebarOpen"
    (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.closed]="!sidebarOpen">
    <button class="toggle-btn" (click)="toggleSidebar()" aria-label="Toggle navigation">
      <span class="material-symbols-rounded">menu</span>
    </button>

    <div class="sidebar-shell">
      <div class="sidebar-main">
        <div class="teacher-header">
          <div class="teacher-avatar">
            <span class="material-symbols-rounded">account_circle</span>
          </div>
          <div class="teacher-copy" *ngIf="sidebarOpen">
            <div class="teacher-name">{{ teacherName }}</div>
            <div class="teacher-meta" *ngIf="teacherDepartment || teacherUid">
              <span *ngIf="teacherDepartment">{{ teacherDepartment }}</span>
              <span *ngIf="teacherUid">{{ teacherUid }}</span>
            </div>
          </div>
        </div>

        <nav class="sidebar-content">
          <button class="nav-btn" routerLink="/profile" routerLinkActive="active" (click)="handleNavSelection()">
            Profile
          </button>

          <button
            class="nav-btn"
            routerLink="/generate"
            routerLinkActive="active"
            (click)="handleNavSelection()"
            [routerLinkActiveOptions]="{ exact: true }">
            Generate
          </button>

          <button class="nav-btn" routerLink="/transform" routerLinkActive="active" (click)="handleNavSelection()">
            Transform
          </button>

          <button class="nav-btn" routerLink="/gap-analysis" routerLinkActive="active" (click)="handleNavSelection()">
            Gap Analysis
          </button>
        </nav>
      </div>

      <div class="sidebar-footer-actions">
        <button type="button" class="logout-btn" (click)="logout()">Logout</button>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
