name: Keep TeachAssist Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend and database
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://teachassist-backend.onrender.com/keep-alive
